<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gửi video luyện tập Pickleball</title>
</head>
<body>
  <h2>Tải video để phân tích kỹ thuật chơi</h2>
  <form action="/upload" method="post" enctype="multipart/form-data">
    <input type="file" name="video" accept="video/*" required>
    <button type="submit">Gửi Video</button>
  </form>
</body>
</html>
