<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>King Pickleball</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/pickleball/css/header.css">
    <link rel="stylesheet" href="/pickleball/css/base.css">
    <script src="/pickleball/js/main.js" defer></script>
</head>
<body>
<!-- Header Fragment -->
<div th:fragment="header">
    <header class="main-header">
        <div class="container__header">
            <nav class="container__header__nav">
                <div class="container__header__nav--left">
                    <div class="dropdown">
                        <a href="#" class="dropdown-toggle">Features</a>
                        <div class="dropdown-menu">
                            <a th:href="@{/structured}">Structured Learning</a>
                            <a th:href="@{/videolibrary}">Video Library</a>
                            <a href="http://127.0.0.1:5000/">AI Technique Analysis</a>
                            <a th:href="@{/process}">Progress Dashboard</a>
                            <a th:href="@{/achievementsbadges}">Achievements & Badges</a>
                            <a href="#">Booking & Payment</a>
                        </div>
                    </div>
                    <a th:href="@{/mylearning}">My Learning</a>
                    <a th:href="@{/forcoach}">For Coach</a>
                </div>
                <div class="container__header__nav--logo">
                    <a th:href="@{/}"><img src="/pickleball/images/Logo app.png" alt="Logo King Pickleball"></a>
                </div>
                <div class="container__header__nav--right">
                    <a th:href="@{/community}">Community</a>
                    <a th:href="@{/blog}">Blog</a>
                    <div class="dropdown">
                        <a class="dropdown-toggle">About us</a>
                        <div class="dropdown-menu">
                            <a th:href="@{/aboutus}">About Us</a>
                            <a th:href="@{/contactus}">Contact Us</a>
                        </div>
                    </div>
                    <!-- Nút Login ngoài cùng nếu chưa đăng nhập -->
                    <a th:if="${session.role == null}" th:href="@{/login}" class="container__header__nav--buttonlogin">Login</a>
                    <!-- Dropdown avatar/profile -->
                    <div class="dropdown" th:if="${session.role != null}">
                        <a class="container__header__nav--button dropdown-toggle">
                            <img th:src="${avatarUrl}" alt="Ảnh đại diện profile" class="profile-avatar" id="avatarPreview">
                        </a>
                        <div class="dropdown-menu dropdown-menu--pr">
                            <a th:href="@{/profile}">Profile</a>
                            <a th:href="@{/logout}">Logout</a>
                        </div>
                    </div>
                </div>
            </nav>
        </div>
    </header>
</div>
</body>
</html>
