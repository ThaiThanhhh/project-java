<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | King Pickleball</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/pickleball/css/login.css">
</head>
<body>
    <div class="login-bg">
        <img src="/pickleball/images/backgroundlogin.png" alt="Background" class="login-bg-img">
    </div>
    <form class="login-form" method="get">
        <a th:href="@{/}" class="login-logo">
            <img src="/pickleball/images/logo app.png" alt="Logo">
        </a>
        <h2>LOGIN</h2>


        
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" class="input-field" placeholder="Email Address" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="input-field" placeholder="Password" required>
        </div>





        <div class="form-options">
            <label><input type="checkbox" name="remember"> Remember me</label>
            <a href="#" style="font-weight: bold;">Forgot password?</a>
        </div>
        <button type="submit" class="login-btn">LOGIN</button>
        <div class="register-link">
            Don't have an account? <a th:href="@{/register}">Register</a>
        </div>
        <div class="divider"><span>OR</span></div>
        <button type="button" class="social-btn">
            <img src="/pickleball/images/gg.png" alt="Google" width="20"> Continue with Google
        </button>
        <button type="button" class="social-btn">
            <img src="/pickleball/images/fb.png" alt="Facebook" width="20"> Continue with Facebook
        </button>
        <p class="terms">
            By signing up you agree to the <strong>Privacy Policy</strong> and <strong>Terms and Conditions</strong>
        </p>
    </form>
    </body>
</html>
