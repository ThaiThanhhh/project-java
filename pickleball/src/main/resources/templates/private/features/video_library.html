<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/pickleball/css/base.css">

<body><div th:replace="fragments/header :: header"></div>



    <!-- Main Content -->
       <div class="container">
        <h1>Video Lecture Library</h1>

            <input id="searchInput" type="text" placeholder="Search lectures...">

        <div class="section">
            <h2>Basic Pickleball Videos</h2>

        <!-- Advanced Videos Section -->
        <div class="section">
            <h2>Advanced Pickleball Videos</h2>
            <div id="advancedVideoGrid" class="video-grid">
                <!-- Advanced videos will be added via JavaScript -->
            </div>
        </div>

        <div class="section">
            <h2>Tournament Pickleball Videos</h2>
            <div id="tournamentVideoGrid" class="video-grid">
                <!-- Advanced videos will be added via JavaScript -->
            </div>
        </div>
    </div>
    <div th:replace="fragments/footer :: footer"></div>
