<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>

        <div class="info">

            </div>
            <div class="info-row">
                <p>Id: 012345</p>
            </div>
            <div class="info-row">
                <p>Email: hieult4655@ut.edu.vn</p>
            </div>
            <div class="info-row">
                <p>Phone: 0816349419</p>
            </div>
        </div>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>
