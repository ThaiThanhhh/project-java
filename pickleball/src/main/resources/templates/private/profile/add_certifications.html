<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>King Pickeball</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/add_certifications.css}">
    <script th:src="@{/js/add_certifications.js}" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/progressbar.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
    <!-- Header -->
    <div th:replace="~{fragments/header :: header}"></div>

    <!-- Main Content -->
    <div class="container">
        <section class="coach-hero">
            <div class="hero-content">
                <h1>CERTIFICATIONS COACH</h1>
                <p>Manage your coaching business with our powerful tools</p>
                <button class="cta-button">Get Started</button>
            </div>
        </section>

        <section class="certification-form">
            <h2>Add Certification</h2>
            <form id="certification__Form" method="post">
                <div class="form-group">
                    <label for="Name">My Name:</label>
                    <input type="text" id="Name" name="Name" required>
                </div>
                <div class="form-group">
                    <label for="CCCD">CCCD:</label>
                    <input type="number" id="CCCD" name="CCCD" required>
                </div>
                <div class="form-group">
                    <label for="certification__Name">Certification Name:</label>
                    <input type="text" id="certification__Name" name="certificationName" required>
                </div>
                <div class="form-group ">
                    <label for="certification__img">Certification image:</label>
                    <input type="file" id="certification__img" accept="image/*" name="certification__img" required>
                </div>
                <div class="form-group">
                    <label for="certification__ID">Certification ID:</label>
                    <input type="number" id="certification__ID" name="certificationID" required>
                </div>
                <div class="submit--btn">
                    <button type="submit" id="submitBtn">Submit</button>
                </div>
            </form>
        </section>
    </div>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
