<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>King Pickleball</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/pickleball/css/header.css">
    <link rel="stylesheet" href="/pickleball/css/base.css">
    <script src="/pickleball/js/main.js" defer></script>
</head>
<body>
<!-- Header Fragment -->
<div th:fragment="header">
    <header class="main-header">
        <div class="container__header">
            <nav class="container__header__nav">
                <div class="container__header__nav--left">
                    <div class="dropdown">
                        <!-- Nếu là coach thì Features bị xám và không click -->
                        <a href="#" class="dropdown-toggle"
                           th:attr="style=${session.role == null or session.role == 'coach'} ? 'pointer-events:none;opacity:0.5;cursor:not-allowed;' : ''">
                            Features
                        </a>
                        <div class="dropdown-menu">
                            <a th:href="@{/structured}"
                               th:attr="style=${session.role == null or session.role == 'coach'} ? 'pointer-events:none;opacity:0.5;cursor:not-allowed;' : ''">Structured Learning</a>
                            <a th:href="@{/videolibrary}"
                               th:attr="style=${session.role == null or session.role == 'coach'} ? 'pointer-events:none;opacity:0.5;cursor:not-allowed;' : ''">Video Library</a>
                            <a th:href="@{/ai}"
                               th:attr="style=${session.role == null or session.role == 'coach'} ? 'pointer-events:none;opacity:0.5;cursor:not-allowed;' : ''">AI Technique Analysis</a>
                            <a th:href="@{/process}"
                               th:attr="style=${session.role == null or session.role == 'coach'} ? 'pointer-events:none;opacity:0.5;cursor:not-allowed;' : ''">Progress Dashboard</a>
                            <a th:href="@{/achievementsbadges}"
                               th:attr="style=${session.role == null or session.role == 'coach'} ? 'pointer-events:none;opacity:0.5;cursor:not-allowed;' : ''">Achievements & Badges</a>
                            <a th:href="@{/bookingpayment}"
                               th:attr="style=${session.role == null or session.role == 'coach'} ? 'pointer-events:none;opacity:0.5;cursor:not-allowed;' : ''">Booking & Payment</a>
                        </div>
                    </div>
                    <!-- My Learning: chỉ student click được, coach thì xám -->
                    <a th:if="${session.role == 'student'}" th:href="@{/mylearning}">My Learning</a>
                    <a th:if="${session.role != 'student'}"
                       href="#"
                       style="pointer-events:none;opacity:0.5;cursor:not-allowed;">My Learning</a>
                    <!-- For Coach: chỉ coach click được, student thì xám -->
                    <a th:if="${session.role == 'coach'}" th:href="@{/forcoach}">For Coach</a>
                    <a th:if="${session.role != 'coach'}"
                       href="#"
                       style="pointer-events:none;opacity:0.5;cursor:not-allowed;">For Coach</a>
                </div>
                <div class="container__header__nav--logo">
                    <a th:href="@{/}"><img src="/pickleball/images/Logo app.png" alt="Logo King Pickleball"></a>
                </div>
                <div class="container__header__nav--right">
                    <a th:href="@{/community}">Community</a>
                    <a th:href="@{/blog}">Blog</a>
                    <div class="dropdown">
                        <a class="dropdown-toggle">About us</a>
                        <div class="dropdown-menu">
                            <a th:href="@{/aboutus}">About Us</a>
                            <a th:href="@{/contactus}">Contact Us</a>
                        </div>
                    </div>
                    <!-- Nút Login ngoài cùng nếu chưa đăng nhập -->
                    <a th:if="${session.role == null}" th:href="@{/login}" class="container__header__nav--buttonlogin">Login</a>
                    <!-- Dropdown avatar/profile -->
                    <div class="dropdown" th:if="${session.role != null}">
                        <a class="container__header__nav--button dropdown-toggle">
                            <img th:src="${avatarUrl}" alt="Ảnh đại diện profile" class="profile-avatar" id="avatarPreview">
                        </a>
                        <div class="dropdown-menu dropdown-menu--pr">
                            <a th:href="@{/profile}">Profile</a>
                            <a th:href="@{/logout}">Logout</a>
                        </div>
                    </div>
                </div>
            </nav>
        </div>
    </header>
</div>
</body>
</html>
