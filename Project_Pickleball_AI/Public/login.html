<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../Assets/CSS/login.css">
</head>
<body>
    <div class="container">
        <img src="../Assets/Img/backgroundlogin.png" alt="backgroundlogin" id="container__background" >
        <div class="container__login">
            <a href="#"><img src="../Assets/Img/logoweb.png" alt="logowweb" id="container__logo"></a>
            <h2>LOGIN</h2>
            <div style="line-height: 0px;">
                <p style="font-weight: 900;">Email Address</p>
                <input type="email" class="input__field" placeholder="Email Address">
            </div>
            <div style="line-height: 1px;">
                <p style="font-weight: 900;">Password</p>
                <input type="password" class="input__field" placeholder="Password">
            </div>
            <div class="remember__me">
                <label><input type="checkbox"> Remember me</label>
                <a href="#">Forget password?</a>
            </div>
            <button class="login__btn" style="font-weight: 700;">LOGIN</button>
            <div class="register__link">Don't have an account? <a href="../Public/register.html">Register</a></div>
            <div id="or">OR</div>
            <button class="social__btn"><img src="../Assets/Img/gg.png" alt="Google" width="20"> Continue with Google</button>
            <button class="social__btn"><img src="../Assets/Img/fb.png" alt="Facebook" width="20"> Continue with Facebook</button>
            <p class="terms">By signing up you agree to the 
            <strong>Privacy Policy</strong>
            and
            <strong>Terms and Conditions</strong>
            </p>
        </div>
    </div>
</body>
</html>
