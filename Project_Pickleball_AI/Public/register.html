<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="../Assets/CSS/register.css">
</head>
<body>
    <div class="container">
        <img src="../Assets/Img/backgroundlogin.png" alt="backgroundlogin" id="container__background" >
        <div class="container__register">
            <a href="#"><img src="../Assets/Img/logoweb.png" alt="logowweb" id="container__logo"></a>
            <h2>REGISTER</h2>
            <div class="login__text">
                <p>Let's start by creating your account </p>
                <div class="login__link">Already have an account? <a href="../Public/login.html"><strong>Log In</strong></a></div>
            </div>
            <input type="text" class="input__field" placeholder="First Name">
            <input type="text" class="input__field" placeholder="Last Name">
            <input type="email" class="input__field" placeholder="Email Address">
            <input type="password" class="input__field" placeholder="Password">
            <input type="password" class="input__field" placeholder="Confirm Password">
            <div class="options">
                <label><input type="checkbox">You are a student</label>
                <label><input type="checkbox">You are a Coach</label>
            </div>
            <button class="login__btn" style="font-weight: 700;">LOGIN</button>
            </p>
        </div>
    </div>
</body>
</html>
